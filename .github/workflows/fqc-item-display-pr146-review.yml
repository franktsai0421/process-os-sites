name: FQC inspection workflow PR146 review (head only)
on:
  pull_request:
    branches: ['review/v68-reset-base-20261123']
    types: [synchronize]
    paths: ['.github/workflows/fqc-item-display-pr146-review.yml']
permissions:
  contents: read
concurrency:
  group: fqc-item-display-pr146-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  isolated-fqc:
    if: github.repository == 'franktsai0421/process-os-sites' && github.event.pull_request.number == 146 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/fqc-abnormal-retest-samples' && github.base_ref == 'review/v68-reset-base-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PROCESS_PROGRAM_COMMIT: ${{ github.event.pull_request.head.sha }}
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_WRITE_LOGS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed source and unchanged migration baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$BASE_SHA" = b80236b70d94070d3de2cfa8fb762e2680804120
          test "$(git rev-parse 69b78e965c316c1aee14c685b2f960e16469f038^{tree})" = 30c99aaa36d6a8e542c8ebb0c54c33c695d36b30
          test "$(git rev-parse HEAD^)" = 69b78e965c316c1aee14c685b2f960e16469f038
          git merge-base --is-ancestor "$BASE_SHA" 69b78e965c316c1aee14c685b2f960e16469f038
          # Only this workflow may differ from the already reviewed candidate.
          git diff --exit-code 69b78e965c316c1aee14c685b2f960e16469f038 HEAD -- . ':(exclude).github/workflows/fqc-item-display-pr146-review.yml'
          # No schema, migration journal, hosting or manifest change is permitted.
          git diff --exit-code "$BASE_SHA" HEAD -- drizzle drizzle-sites-fresh db .openai SOURCE-PROFILE.json package.json package-lock.json
          printf "Tested HEAD: %s\nTree: %s\nReview base: %s\n" "$HEAD_SHA" "$(git rev-parse HEAD^{tree})" "$BASE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx --no-install tsc --noEmit --incremental false
      - name: FQC calendar, receipt, and bilingual inspection display
        run: |
          node --test tests/routine-fqc-calendar.test.cjs tests/routine-fqc-durable-receipt.test.mjs tests/routine-fqc-item-display.test.mjs tests/routine-reset-assets.test.mjs
          node scripts/test-routine-fqc-search.mjs
      - name: Build local worker for isolated scenarios
        run: npm run build
      - name: Initial and retest reports through approval and disposition
        run: node tests/routine-plan-workflows-native.mjs
