name: Admin Reset PR142 review (head only)
on:
  pull_request:
    branches: ['review/v68-reset-base-20261123']
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: admin-reset-pr142-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  isolated-reset:
    if: github.repository == 'franktsai0421/process-os-sites' && github.event.pull_request.number == 142 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/scoped-admin-reset-20261123' && github.base_ref == 'review/v68-reset-base-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PROCESS_PROGRAM_COMMIT: ${{ github.event.pull_request.head.sha }}
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_WRITE_LOGS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed source and unchanged migration baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$BASE_SHA" = b6d9b3fd0f6ae2ca98f3909413547586e755184c
          test "$(git rev-parse c60c63da654b8de7b16e9bf681df92ec09e68215^{tree})" = fb80661a2e1deea7c68f0ea0c971eaaceff49ec8
          git merge-base --is-ancestor c60c63da654b8de7b16e9bf681df92ec09e68215 HEAD
          # Only this workflow may differ from the already reviewed candidate.
          git diff --exit-code c60c63da654b8de7b16e9bf681df92ec09e68215 HEAD -- . ':(exclude).github/workflows/admin-reset-pr142-review.yml'
          # No schema, migration journal, hosting or manifest change is permitted.
          git diff --exit-code "$BASE_SHA" HEAD -- drizzle drizzle-sites-fresh db .openai SOURCE-PROFILE.json package.json package-lock.json
          printf "Tested HEAD: %s\nTree: %s\nReview base: %s\n" "$HEAD_SHA" "$(git rev-parse HEAD^{tree})" "$BASE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx --no-install tsc --noEmit --incremental false
      - name: Isolated Reset, enrollment, pending and period regressions
        run: node --test tests/routine-admin-reset.test.cjs tests/routine-reset*.test.cjs tests/routine-reset*.test.mjs tests/routine-startup-isolated-restart.test.cjs tests/routine-iqc-workflow.test.mjs tests/routine-fqc-calendar.test.cjs tests/routine-iqc-workspace.test.mjs tests/routine-fqc-durable-receipt.test.mjs
