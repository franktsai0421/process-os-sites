name: FQC operation recovery PR148 review (head only)
on:
  pull_request:
    branches: ['review/v68-reset-base-20261123']
    types: [synchronize]
    paths: ['.github/workflows/fqc-operation-recovery-pr148-review.yml']
permissions:
  contents: read
concurrency:
  group: fqc-operation-recovery-pr148-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  isolated-fqc:
    if: github.repository == 'franktsai0421/process-os-sites' && github.event.pull_request.number == 148 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/fqc-operation-scoped-recovery' && github.base_ref == 'review/v68-reset-base-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PROCESS_PROGRAM_COMMIT: ${{ github.event.pull_request.head.sha }}
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_WRITE_LOGS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed source and unchanged migration baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$BASE_SHA" = ac86da031cc43eb3d833f0968c54da4b8bf1c9ff
          test "$(git rev-parse 1aba62c661542afac56b565901c338940d98546a^{tree})" = 4cf156b2c3da7faa7e8bd71fc24c02627248349d
          test "$(git rev-parse HEAD^)" = 1aba62c661542afac56b565901c338940d98546a
          git merge-base --is-ancestor "$BASE_SHA" 1aba62c661542afac56b565901c338940d98546a
          # Only this workflow may differ from the already reviewed candidate.
          git diff --exit-code 1aba62c661542afac56b565901c338940d98546a HEAD -- . ':(exclude).github/workflows/fqc-operation-recovery-pr148-review.yml'
          # No schema, migration journal, hosting or manifest change is permitted.
          git diff --exit-code "$BASE_SHA" HEAD -- drizzle drizzle-sites-fresh db .openai SOURCE-PROFILE.json package.json package-lock.json
          printf "Tested HEAD: %s\nTree: %s\nReview base: %s\n" "$HEAD_SHA" "$(git rev-parse HEAD^{tree})" "$BASE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx --no-install tsc --noEmit --incremental false
      - name: Build local worker
        run: npm run build
      - name: Independent Save and Submit, document receipts and recovery races
        run: node --test tests/routine-fqc-durable-route.test.mjs
      - name: Receipt lookup, navigation, calendar and client asset regressions
        run: |
          node --test tests/fqc-save-choice-navigation.test.mjs tests/routine-fqc-durable-receipt.test.mjs tests/routine-fqc-receipt-only.test.mjs tests/routine-fqc-calendar.test.cjs tests/routine-fqc-item-display.test.mjs tests/routine-fqc-departure-attribution.test.mjs tests/routine-fqc-approved-history.test.mjs tests/routine-reset-assets.test.mjs
          node scripts/test-routine-fqc-search.mjs
