name: IQC reserved periods PR153 review (head only)
on:
  pull_request:
    branches: ['review/v68-reset-base-20261123']
    types: [synchronize]
    paths: ['.github/workflows/iqc-period-pr153-review.yml']
permissions:
  contents: read
concurrency:
  group: iqc-period-pr153-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  isolated-iqc:
    if: github.repository == 'franktsai0421/process-os-sites' && github.event.pull_request.number == 153 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/iqc-reserved-period-visibility' && github.base_ref == 'review/v68-reset-base-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PROCESS_PROGRAM_COMMIT: ${{ github.event.pull_request.head.sha }}
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_WRITE_LOGS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed source and unchanged migration baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$BASE_SHA" = 46e07acbba6cfee656cfe959560eebba5d79328a
          test "$(git rev-parse 7e0a97e2b1a31048941d27869e8b700acb037deb^{tree})" = e7a567146b70cb33f8922ae8f5d0d18ed6875c54
          test "$(git rev-parse HEAD^)" = 7e0a97e2b1a31048941d27869e8b700acb037deb
          git merge-base --is-ancestor "$BASE_SHA" 7e0a97e2b1a31048941d27869e8b700acb037deb
          # Only this workflow may differ from the already reviewed candidate.
          git diff --exit-code 7e0a97e2b1a31048941d27869e8b700acb037deb HEAD -- . ':(exclude).github/workflows/iqc-period-pr153-review.yml'
          # No schema, migration journal, hosting or manifest change is permitted.
          git diff --exit-code "$BASE_SHA" HEAD -- drizzle drizzle-sites-fresh db .openai SOURCE-PROFILE.json package.json package-lock.json
          printf "Tested HEAD: %s\nTree: %s\nReview base: %s\n" "$HEAD_SHA" "$(git rev-parse HEAD^{tree})" "$BASE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx --no-install tsc --noEmit --incremental false
      - name: Build local worker
        run: npm run build
      - name: Verify period visibility, reservations, expired draft write guards and cache
        run: node --test tests/routine-iqc-workspace.test.mjs tests/routine-iqc-source.test.mjs tests/routine-reset-assets.test.mjs
