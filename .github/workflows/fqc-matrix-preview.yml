name: FQC matrix position preview
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/process/fqc-master.js'
      - 'public/process/fqc-master.css'
      - 'tests/fqc-matrix-browser.test.mjs'
      - 'scripts/test-fqc-matrix-layout.mjs'
      - '.github/workflows/fqc-matrix-preview.yml'
permissions:
  contents: read
concurrency:
  group: fqc-matrix-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PROCESS_PROGRAM_COMMIT: ${{ github.sha }}
      FQC_MATRIX_SCREENSHOTS_DIR: .sites-runtime/fqc-matrix-preview
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_WRITE_LOGS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies and native Chromium
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node node_modules/playwright/cli.js install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Render actual FQC module with synthetic data only
        run: |
          node scripts/test-fqc-matrix-layout.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/fqc-matrix-browser.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain verified screenshots and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fqc-matrix-position-preview
          path: |
            .sites-runtime/fqc-matrix-preview/matrix-*.png
            .sites-runtime/fqc-matrix-preview/matrix-*.json
          if-no-files-found: error
          retention-days: 7
