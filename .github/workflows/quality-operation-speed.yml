name: Quality operation speed
on:
  pull_request:
    paths:
      - 'lib/**'
      - 'app/api/**'
      - 'tests/quality-operation*'
      - 'tests/quality-process-speed.test.cjs'
      - 'scripts/quality-operation*'
      - '.github/workflows/quality-operation-speed.yml'
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc --noEmit --incremental false
      - run: node --test --test-concurrency=1 tests/quality-operation-source.test.cjs tests/quality-operation-speed.test.cjs tests/quality-process-speed.test.cjs tests/fqc-read-ahead.test.mjs tests/iqc-local-atomic-save.test.cjs tests/process-canvas-atomic-save-http.test.mjs
        env:
          QUALITY_FIXTURE_DELAY_MS: '10'
          QUALITY_FIXTURE_PARTS: '1000'
          QUALITY_FIXTURE_OPERATIONS: '1000'
