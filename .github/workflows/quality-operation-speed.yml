name: Quality operation speed
on:
  pull_request:
    paths:
      - 'lib/**'
      - 'app/api/**'
      - 'tests/quality-operation*'
      - 'tests/quality-process-speed.test.cjs'
      - 'tests/quality-ipqc-profile.test.cjs'
      - 'tests/quality-authoring-bootstrap.test.cjs'
      - 'public/process/shared-state.js'
      - 'scripts/quality-operation*'
      - '.github/workflows/quality-operation-speed.yml'
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc --noEmit --incremental false
      - run: node --test --test-concurrency=1 tests/quality-account-integration-source.test.cjs tests/quality-inventory-integration-source.test.cjs tests/quality-operation-source.test.cjs tests/quality-operation-speed.test.cjs tests/quality-process-speed.test.cjs tests/quality-ipqc-profile.test.cjs tests/quality-read-wire.test.cjs tests/quality-authoring-bootstrap.test.cjs tests/authoring-readiness-render.test.mjs tests/fqc-read-ahead.test.mjs tests/iqc-local-atomic-save.test.cjs tests/process-canvas-atomic-save-http.test.mjs
        env:
          QUALITY_FIXTURE_DELAY_MS: '10'
          QUALITY_FIXTURE_PARTS: '1000'
          QUALITY_FIXTURE_OPERATIONS: '1000'
  native-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROCESS_PROGRAM_COMMIT: ${{ github.event.pull_request.head.sha }}
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_WRITE_LOGS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: node node_modules/playwright/cli.js install --with-deps chromium
      - run: node tests/quality-authoring-ready-browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quality-authoring-ready-${{ github.event.pull_request.head.sha }}
          path: .sites-runtime/quality-authoring-ready/
          if-no-files-found: ignore
