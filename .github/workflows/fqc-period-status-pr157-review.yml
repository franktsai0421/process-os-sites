name: FQC period and status filters PR157 review (head only)
on:
  pull_request:
    branches: ['review/v68-reset-base-20261123']
    types: [synchronize]
    paths: ['.github/workflows/fqc-period-status-pr157-review.yml']
permissions:
  contents: read
concurrency:
  group: fqc-period-status-pr157-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  isolated-fqc:
    if: github.repository == 'franktsai0421/process-os-sites' && github.event.pull_request.number == 157 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/fqc-period-status-filters' && github.base_ref == 'review/v68-reset-base-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PROCESS_PROGRAM_COMMIT: ${{ github.event.pull_request.head.sha }}
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_WRITE_LOGS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed source and unchanged migration baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$BASE_SHA" = 37d76cc958152dd6049484bf14a5f34c4bd0428c
          test "$(git rev-parse 90bdd9935e7334f89f24ddf0cbc6efc5e49db7d2^{tree})" = 0ab31c8636511eb17900ddbbc3c4a8791d278457
          test "$(git rev-parse HEAD^)" = 90bdd9935e7334f89f24ddf0cbc6efc5e49db7d2
          git merge-base --is-ancestor "$BASE_SHA" 90bdd9935e7334f89f24ddf0cbc6efc5e49db7d2
          # Only this workflow may differ from the already reviewed candidate.
          git diff --exit-code 90bdd9935e7334f89f24ddf0cbc6efc5e49db7d2 HEAD -- . ':(exclude).github/workflows/fqc-period-status-pr157-review.yml'
          # No schema, migration journal, hosting or manifest change is permitted.
          git diff --exit-code "$BASE_SHA" HEAD -- drizzle drizzle-sites-fresh db .openai SOURCE-PROFILE.json package.json package-lock.json
          printf "Tested HEAD: %s\nTree: %s\nReview base: %s\n" "$HEAD_SHA" "$(git rev-parse HEAD^{tree})" "$BASE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx --no-install tsc --noEmit --incremental false
      - name: Build local worker
        run: npm run build
      - name: FQC filters, bilingual inspection periods, calendar and shell assets
        run: node --test tests/routine-fqc-status-filters.test.mjs tests/routine-fqc-calendar.test.cjs tests/routine-reset-assets.test.mjs
      - name: FQC bilingual refresh, deferred history and queue visibility
        run: node --test --test-name-pattern='normal Update and separate|deferred terminal case bodies|visible FQC plan and report' tests/routine-fqc-explicit-refresh.test.mjs tests/routine-fqc-manual-generation.test.mjs
      - name: Verify whole-page workflow, permissions and receipt isolation
        run: node scripts/test-routine-whole-page-route.cjs
