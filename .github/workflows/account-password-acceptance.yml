name: Account password compiled acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/api/platform-login/**'
      - 'app/api/user-access/**'
      - 'lib/passwords.ts'
      - 'lib/user-access.ts'
      - 'lib/process-state.ts'
      - 'public/process/user-access*'
      - 'public/process/access-policy.mjs'
      - 'public/process/app.js'
      - 'public/process/i18n.js'
      - 'public/process/navigation-forms.js'
      - 'public/process/version-draft-ui.js'
      - 'tests/account-*.mjs'
      - 'tests/user-access-*.mjs'
      - 'tests/native-account-ci-contract.test.mjs'
      - 'tests/native-acceptance-browser-options.mjs'
      - 'tests/root-entry-native-fixture.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/account-password-acceptance.yml'
permissions:
  contents: read
concurrency:
  group: account-password-acceptance-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  compiled-confirm:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      PROCESS_PROGRAM_COMMIT: ${{ github.sha }}
      PROCESS_NATIVE_ACCEPTANCE: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_SEND_ERROR_REPORTS: 'false'
      WRANGLER_WRITE_LOGS: 'false'
      npm_config_update_notifier: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Locked install and unchanged source guard
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/sites-ci-preflight.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Account handler and launcher contracts (no browser)
        run: node --test tests/account-login-password.test.mjs tests/native-account-ci-contract.test.mjs
      - name: Build the exact GitHub PR merge commit
        run: npm run build
      - name: Compiled account Confirm and password login (ephemeral D1 and R2)
        run: node tests/user-access-prewrite-native.test.mjs
# This scoped acceptance does not replace Local safety, broader UI acceptance,
# physical-device validation, or an explicitly authorized real-account check.
