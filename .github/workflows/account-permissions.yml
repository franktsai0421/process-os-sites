name: Account permissions
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/api/platform-login/**'
      - 'app/api/user-access/**'
      - 'lib/passwords.ts'
      - 'lib/user-access.ts'
      - 'lib/web-feedback.ts'
      - 'public/process/web-feedback*'
      - 'tests/account-*.test.cjs'
      - 'public/process/user-access*'
      - 'public/process/access-policy.mjs'
      - 'public/process/data-safety-ui.js'
      - 'public/process/index.html'
      - 'tests/account-*.test.mjs'
      - 'tests/helpers/native-worker-source.mjs'
      - '.github/workflows/account-permissions.yml'
permissions:
  contents: read
concurrency:
  group: account-permissions-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_WRITE_LOGS: 'false'
      PROCESS_PROGRAM_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint -- --format unix
      - run: node node_modules/typescript/bin/tsc --noEmit --incremental false
      - name: Isolated account API and UI source regression
        run: node --experimental-vm-modules --test --test-concurrency=1 tests/account-priority-api.test.mjs tests/account-dialog-feedback.test.mjs tests/account-login-language.test.mjs tests/account-result-notice.test.mjs
      - name: Existing account authority and session protections
        run: |
          node scripts/test-user-access.mjs
          node scripts/test-role-effective-session.cjs
          node scripts/test-user-access-projection-reuse.mjs
          node scripts/test-user-access-dialog-dirty.mjs
          node scripts/test-user-access-response-fence.mjs
          node scripts/test-user-access-initial-read.mjs
          node scripts/test-login-entry-marker.cjs
          node scripts/test-login-reentry.cjs
          node scripts/test-login-json-coercion.mjs
      - name: Exact account cache and retained background source proofs
        run: node --test tests/account-cache-source-proof.test.cjs tests/account-permission-source-proof.test.cjs tests/background-check-source-proof.test.cjs tests/routine-fqc-source-contract.test.cjs tests/navigation-adapters.test.mjs
      - name: Aligned permissions and feedback source authorization
        run: |
          node --test tests/account-permission-alignment.test.cjs tests/account-feedback-shell.test.cjs tests/account-feedback-source-security.test.cjs tests/access-events-api.test.cjs tests/web-feedback-cloud.test.mjs tests/web-feedback-access.test.mjs tests/web-feedback-layout.test.mjs tests/web-feedback-zip.test.cjs
          node --test tests/problem-export.test.cjs tests/master-ab-auth-phase.test.mjs
          node scripts/test-access-template-reuse.cjs
          node scripts/test-feedback-cloud-admission.cjs
          node scripts/test-web-feedback.cjs "$RUNNER_TEMP/account-feedback"
          USER_PERMISSIONS_EVIDENCE="$RUNNER_TEMP/account-permissions" node scripts/audit-users-page-permissions.mjs
      - run: node scripts/sites-ci-preflight.mjs
      - run: npm run build
