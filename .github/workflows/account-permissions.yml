name: Account permissions
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/account-process-joint-source-contract.cjs'
      - 'scripts/account-process-joint-source-contract.json'
      - 'tests/account-process-joint-source.test.cjs'
      - 'app/api/platform-login/**'
      - 'app/api/user-access/**'
      - 'lib/passwords.ts'
      - 'lib/user-access.ts'
      - 'lib/web-feedback.ts'
      - 'public/process/web-feedback*'
      - 'tests/account-*.test.cjs'
      - 'scripts/test-process-save-record-mutation.cjs'
      - 'scripts/test-fqc-lifecycle8-record-mutation.cjs'
      - 'scripts/test-legacy-draft-rights.mjs'
      - 'scripts/account-permission-source-contract.*'
      - 'scripts/account-page-source-contract.*'
      - 'app/api/master/pages/**'
      - 'app/api/routine-fqc/page/**'
      - 'public/process/*page*'
      - 'public/process/account-review-preview.mjs'
      - 'public/process/draft-review-policy.mjs'
      - 'scripts/account-cache-source-contract.*'
      - 'tests/access-event-main-integration.test.cjs'
      - 'tests/shared-draft-receipt-recovery.test.mjs'
      - 'public/process/user-access*'
      - 'public/process/access-policy.mjs'
      - 'public/process/data-safety-ui.js'
      - 'public/process/index.html'
      - 'public/process/master-data.js'
      - 'public/process/shared-draft-client.js'
      - 'tests/account-*-browser.mjs'
      - 'tests/account-*.test.mjs'
      - 'tests/helpers/native-worker-source.mjs'
      - '.github/workflows/account-permissions.yml'
permissions:
  contents: read
concurrency:
  group: account-permissions-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_WRITE_LOGS: 'false'
      PROCESS_PROGRAM_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint -- --format unix
      - run: node node_modules/typescript/bin/tsc --noEmit --incremental false
      - name: Isolated account API and UI source regression
        run: node --experimental-vm-modules --test --test-concurrency=1 tests/account-priority-api.test.mjs tests/account-dialog-feedback.test.mjs tests/account-login-language.test.mjs tests/account-result-notice.test.mjs tests/account-policy-source-loader.test.mjs
      - name: Existing account authority and session protections
        run: |
          node scripts/test-user-access.mjs
          node scripts/test-role-effective-session.cjs
          node scripts/test-user-access-projection-reuse.mjs
          node scripts/test-user-access-dialog-dirty.mjs
          node scripts/test-user-access-response-fence.mjs
          node scripts/test-user-access-initial-read.mjs
          node scripts/test-login-entry-marker.cjs
          node scripts/test-login-reentry.cjs
          node scripts/test-login-json-coercion.mjs
      - name: Exact account cache and retained background source proofs
        run: node --test tests/account-process-joint-source.test.cjs tests/account-cache-source-proof.test.cjs tests/account-permission-source-proof.test.cjs tests/access-event-main-integration.test.cjs tests/shared-draft-receipt-recovery.test.mjs tests/background-check-source-proof.test.cjs tests/routine-fqc-source-contract.test.cjs tests/navigation-adapters.test.mjs
      - name: Aligned permissions and feedback source authorization
        run: |
          node --test tests/account-permission-alignment.test.cjs tests/account-user-reset.test.cjs tests/account-editor-routine-save.test.cjs tests/account-lines-view.test.cjs tests/account-master-readback.test.mjs tests/account-feedback-shell.test.cjs tests/account-feedback-source-security.test.cjs tests/access-events-api.test.cjs tests/web-feedback-cloud.test.mjs tests/web-feedback-access.test.mjs tests/web-feedback-layout.test.mjs tests/web-feedback-zip.test.cjs
          node --test tests/problem-export.test.cjs tests/master-ab-auth-phase.test.mjs
          node scripts/test-process-save-record-mutation.cjs
          node scripts/test-fqc-lifecycle8-record-mutation.cjs
          node scripts/test-legacy-draft-rights.mjs
          node scripts/test-access-template-reuse.cjs
          node scripts/test-feedback-cloud-admission.cjs
          node scripts/test-web-feedback.cjs "$RUNNER_TEMP/account-feedback"
          USER_PERMISSIONS_EVIDENCE="$RUNNER_TEMP/account-permissions" node scripts/audit-users-page-permissions.mjs
      - name: Isolated page permissions, platform review and Routine whole-page owners
        run: |
          node --experimental-vm-modules --test --test-concurrency=1 tests/account-final-approval.test.cjs tests/account-review-preview.test.cjs tests/account-lines-save-adoption.test.cjs tests/account-master-page-review.test.cjs tests/account-module-review-access.test.cjs tests/account-routine-save-ui.test.cjs tests/account-page-entry.test.cjs tests/account-page-source-proof.test.cjs tests/draft-review-policy.test.mjs
          node --experimental-vm-modules --test --test-concurrency=1 tests/master-page-approved-history.test.mjs tests/master-page-approved-history-ui.test.mjs tests/master-page-retention-snapshot.test.mjs tests/routine-page-approved-history.test.mjs tests/routine-page-approved-history-ui.test.mjs tests/routine-page-review-policy.test.mjs
          node scripts/test-process-page-roles.cjs
          node scripts/test-master-page-runtime.cjs
          node scripts/test-master-page-ui.cjs
          node scripts/test-master-page-boundary.cjs
          node scripts/test-master-page-name-save.cjs
          node scripts/test-master-page-review-regressions.cjs
          node scripts/test-master-page-transfer.cjs
          node scripts/test-master-page-tools-ui.cjs
          node scripts/test-master-line-page-workflow.cjs
          node scripts/test-master-public-page-authority.cjs
          node scripts/test-routine-page-domain-helpers.cjs
          node scripts/test-routine-fqc-page-save.cjs
          node scripts/test-routine-whole-page.cjs
          node scripts/test-routine-whole-page-route.cjs
          node scripts/test-routine-whole-page-ui.cjs
          node scripts/test-routine-page-photo-outcome.cjs
      - run: node scripts/sites-ci-preflight.mjs
      - run: npm run build
      - name: Install isolated Chromium
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Native lines-only approved page without workflow grants
        run: node tests/account-lines-view-browser.mjs
