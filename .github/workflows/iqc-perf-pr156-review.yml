name: IQC performance PR156 review (head only)
on:
  pull_request:
    branches: ['review/v68-reset-base-20261123']
    types: [synchronize]
    paths: ['.github/workflows/iqc-perf-pr156-review.yml']
permissions:
  contents: read
concurrency:
  group: iqc-perf-pr156-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  isolated-iqc:
    if: github.repository == 'franktsai0421/process-os-sites' && github.event.pull_request.number == 156 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'perf/iqc-source-projection-local' && github.base_ref == 'review/v68-reset-base-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      BASE_SHA: 80d59b89e4ade103efee5e2c9d51499949bdc70c
      PROCESS_PROGRAM_COMMIT: ${{ github.event.pull_request.head.sha }}
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_WRITE_LOGS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed source and unchanged migration baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse refs/remotes/origin/review/v68-reset-base-20261123)" = "$BASE_SHA"
          case "$EVENT_BASE_SHA" in "$BASE_SHA"|37d76cc958152dd6049484bf14a5f34c4bd0428c) ;; *) exit 1 ;; esac
          test "$(git rev-parse aab60512f831eca887210a276aec1bbbac37e25b^{tree})" = 099424f49e6064a692c0498a928775bca73a54c1
          test "$(git rev-parse HEAD^)" = 04a74308c619e89a0e381e0271ff3f581085dde3
          test "$(git rev-parse HEAD^^)" = aab60512f831eca887210a276aec1bbbac37e25b
          test "$(git merge-base "$BASE_SHA" aab60512f831eca887210a276aec1bbbac37e25b)" = 37d76cc958152dd6049484bf14a5f34c4bd0428c
          test "$(git merge-tree --write-tree "$BASE_SHA" aab60512f831eca887210a276aec1bbbac37e25b)" = 30f9f4333a1676aa87dd657cea76c6b57df68aaa
          # Only this workflow may differ from the already reviewed candidate.
          git diff --exit-code aab60512f831eca887210a276aec1bbbac37e25b HEAD -- . ':(exclude).github/workflows/iqc-perf-pr156-review.yml'
          # No schema, migration journal, hosting or manifest change is permitted.
          git diff --exit-code "$BASE_SHA" HEAD -- drizzle drizzle-sites-fresh db .openai SOURCE-PROFILE.json package.json package-lock.json
          printf "Tested HEAD: %s\nTree: %s\nReview base: %s\n" "$HEAD_SHA" "$(git rev-parse HEAD^{tree})" "$BASE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx --no-install tsc --noEmit --incremental false
      - name: Build local worker
        run: npm run build
      - name: Count IQC list session lookups on isolated storage
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fixture from './scripts/fqc-apply-fixture.cjs';
          const f = await fixture();
          try {
            await f.mutate(values => {
              const users = JSON.parse(values.platformUsers);
              Object.assign(users[0].accessOverrides, {'routine.view':true, 'iqc.view':true});
              values.platformUsers = JSON.stringify(users);
              values.routineFqcEnabled = '1';
            });
            const route = f.load('app/api/routine-iqc/route.ts');
            let reads = 0;
            f.hooks.sql = sql => { if (sql.includes('process_revoked_sessions')) reads++; };
            const response = await route.GET(new Request('https://synthetic.invalid/api/routine-iqc', {headers:{cookie:f.cookies.editor}}));
            assert.equal(response.status, 200);
            assert.equal(reads, 2);
            console.log('Successful IQC list GET: %d session revocation lookups', reads);
          } finally { f.close(); }
          NODE
      - name: IQC route reads, revocation during GET Save Submit, archive availability and business workflow
        run: node --test tests/routine-iqc-workflow.test.mjs tests/routine-iqc-source.test.mjs tests/routine-iqc-workspace.test.mjs tests/routine-admin-reset.test.cjs tests/routine-iqc-reset-readback.test.cjs
      - name: Verify exact combined product tree with merged FQC filters
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only -z 37d76cc958152dd6049484bf14a5f34c4bd0428c "$BASE_SHA" | git restore --source="$BASE_SHA" --staged --worktree --pathspec-from-file=- --pathspec-file-nul
          git diff --cached --exit-code 30f9f4333a1676aa87dd657cea76c6b57df68aaa -- . ':(exclude).github/workflows/iqc-perf-pr156-review.yml'
          git diff --exit-code
      - name: Integrated TypeScript, Worker build and IQC plus FQC regression
        run: |
          npx --no-install tsc --noEmit --incremental false
          npm run build
          node --test tests/routine-iqc-workflow.test.mjs tests/routine-iqc-source.test.mjs tests/routine-fqc-status-filters.test.mjs tests/routine-reset-assets.test.mjs
