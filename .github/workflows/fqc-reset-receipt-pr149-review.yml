name: FQC reset receipt PR149 review (head only)
on:
  pull_request:
    branches: ['review/v68-reset-base-20261123']
    types: [synchronize]
    paths: ['.github/workflows/fqc-reset-receipt-pr149-review.yml']
permissions:
  contents: read
concurrency:
  group: fqc-reset-receipt-pr149-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  isolated-fqc:
    if: github.repository == 'franktsai0421/process-os-sites' && github.event.pull_request.number == 149 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/fqc-reset-retired-receipt' && github.base_ref == 'review/v68-reset-base-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PROCESS_PROGRAM_COMMIT: ${{ github.event.pull_request.head.sha }}
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_WRITE_LOGS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed source and unchanged migration baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$BASE_SHA" = 15e9b772e3064f19f6635c74e9445a28fe235772
          test "$(git rev-parse 4f41ebb5dbbc24a26b65128d1f6010713985a2f9^{tree})" = 209eba0fd9311373c7295923a47cb1b8a0dfb475
          test "$(git rev-parse HEAD^)" = 4f41ebb5dbbc24a26b65128d1f6010713985a2f9
          git merge-base --is-ancestor "$BASE_SHA" 4f41ebb5dbbc24a26b65128d1f6010713985a2f9
          # Only this workflow may differ from the already reviewed candidate.
          git diff --exit-code 4f41ebb5dbbc24a26b65128d1f6010713985a2f9 HEAD -- . ':(exclude).github/workflows/fqc-reset-receipt-pr149-review.yml'
          # No schema, migration journal, hosting or manifest change is permitted.
          git diff --exit-code "$BASE_SHA" HEAD -- drizzle drizzle-sites-fresh db .openai SOURCE-PROFILE.json package.json package-lock.json
          printf "Tested HEAD: %s\nTree: %s\nReview base: %s\n" "$HEAD_SHA" "$(git rev-parse HEAD^{tree})" "$BASE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx --no-install tsc --noEmit --incremental false
      - name: Build local worker
        run: npm run build
      - name: Reset settlement, cross-browser readback and independent FQC writes
        run: node --test tests/routine-reset-pending-settlement.test.cjs tests/routine-fqc-receipt-only.test.mjs tests/routine-fqc-durable-route.test.mjs tests/routine-fqc-durable-receipt.test.mjs
