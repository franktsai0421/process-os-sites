name: Process IPQC link rules
on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/process*.ts'
      - 'public/process/process-*.js'
      - 'public/process/index.html'
      - 'tests/process-ipqc*'
      - 'scripts/process-ipqc-link-*'
      - 'scripts/password-outcome-source-contract.cjs'
      - '.github/workflows/process-ipqc-link-rules.yml'
permissions:
  contents: read
concurrency:
  group: process-ipqc-link-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROCESS_PROGRAM_COMMIT: ${{ github.event.pull_request.head.sha }}
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_WRITE_LOGS: 'false'
      IPQC_LINK_UI_OUT: ${{ github.workspace }}/ipqc-link-ui-evidence
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Exact source inverse and negative controls
        run: node --test tests/process-ipqc-link-source.test.cjs tests/lines-flow-joint-source.test.cjs tests/lines-flow-source.test.cjs tests/ipqc-save-recovery-source.test.cjs tests/navigation-adapters.test.mjs tests/shared-draft-receipt-recovery.test.mjs tests/account-password-source.test.cjs
      - name: New source lifecycle, product/scope, races and saved release
        run: node --test tests/process-ipqc-link-rules.test.cjs tests/process-ipqc-source-adopt.test.mjs tests/process-ipqc-source-history-route.test.mjs tests/process-canvas-atomic-save-stack.test.mjs tests/canvas-pending-form-admission.test.mjs
      - name: Actual validator paired decode and merged approved-page import binding
        run: node scripts/test-authoring-ipqc-assignment-reuse.cjs
      - name: Exact historical read reuse with explicit AB completeness delta
        run: node scripts/test-authoring-ipqc-read-reuse.cjs
      - name: Current C assignment and retained legacy query guards
        run: node scripts/test-process-ipqc-c-query.cjs
      - name: Historical source and no-background compatibility
        run: node --test tests/accounts-process-integration-source.test.mjs tests/process-platform-canvas-contract.test.cjs tests/background-check-source-proof.test.cjs tests/global-background-checks.test.mjs
      - run: npm run lint
        if: ${{ !cancelled() }}
      - run: npx tsc --noEmit --incremental false
        if: ${{ !cancelled() }}
      - name: Build exact head
        id: build_exact
        if: ${{ !cancelled() }}
        run: npm run build
      - run: node node_modules/playwright/cli.js install --with-deps chromium
        id: native_browser
        if: ${{ !cancelled() && steps.build_exact.outcome == 'success' }}
      - name: Native production editor and real signed routes with generated sources
        if: ${{ !cancelled() && steps.build_exact.outcome == 'success' && steps.native_browser.outcome == 'success' }}
        run: node tests/process-ipqc-link-browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: process-ipqc-link-ui-${{ github.event.pull_request.head.sha }}
          path: ipqc-link-ui-evidence
          if-no-files-found: error
