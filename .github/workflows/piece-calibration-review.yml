name: Native calibration review
on:
  pull_request:
    branches: ['review/v68-reset-base-20261123']
    paths:
      - 'app/api/piece-calibration/**'
      - 'lib/piece-calibration*'
      - 'public/process/piece-calibration.*'
      - 'tests/piece-calibration*'
      - '.github/workflows/piece-calibration-review.yml'
permissions:
  contents: read
jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROCESS_PROGRAM_COMMIT: ${{ github.event.pull_request.head.sha }}
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit --incremental false
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node --test --test-concurrency=1 tests/piece-calibration-reset-model.test.mjs tests/piece-calibration-native-integration.test.mjs tests/piece-calibration-native-browser.test.mjs
