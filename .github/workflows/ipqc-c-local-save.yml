name: IPQC C local Save
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/process/ipqc-c.js'
      - 'public/process/shared-draft-client.js'
      - 'tests/ipqc-c-local-save-rejection.test.mjs'
      - 'tests/ipqc-c-case-comparison.test.mjs'
      - 'tests/ipqc-c-equipment-display.test.mjs'
      - 'lib/ipqc-c-workflow.ts'
      - 'app/api/ipqc-c/workflow/route.ts'
      - 'scripts/*ipqc-c*'
      - 'app/api/ipqc-c/route.ts'
      - 'lib/ipqc-c-access.ts'
      - 'lib/approved-history.ts'
      - 'tests/*ipqc-c*'
      - 'tests/shared-draft-restore-admission.test.cjs'
      - 'scripts/test-integrated-workflow-cycles.cjs'
      - 'scripts/test-ipqc-c-compare-save.cjs'
      - 'scripts/background-check-source-contract.cjs'
      - 'scripts/workflow-begin-source-contract.cjs'
      - 'scripts/access-event-source-contract.cjs'
      - 'public/process/version-draft-ui.js'
      - '.github/workflows/ipqc-c-local-save.yml'
permissions:
  contents: read
jobs:
  local-save:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/ipqc-c-local-save-rejection.test.mjs tests/ipqc-c-case-comparison.test.mjs tests/ipqc-c-equipment-display.test.mjs
      - run: node --test tests/ipqc-c-integration-source-contract.test.cjs tests/ipqc-c-operation-admission.test.cjs tests/multiuser-ipqc-c-local-recovery-actual-stack.test.mjs tests/ipqc-c-read-io-source-contract.test.mjs
      - run: node scripts/test-ipqc-c-operation-permissions.cjs
      - run: node --test tests/shared-draft-restore-admission.test.cjs
      - run: node scripts/test-approved-history-evidence.cjs
      - run: node scripts/test-ipqc-c-compare-save.cjs
      - run: node scripts/test-ipqc-c-tombstone-revival.cjs
      - run: node scripts/test-ipqc-c-local-save.cjs
      - run: node scripts/test-ipqc-c-local-browser.cjs
        env:
          IPQCC_PROFILE: '1'
      - run: node scripts/test-ipqc-c-local-gauge-browser.cjs
      - run: node scripts/benchmark-ipqc-c-local-save.cjs
      - run: node scripts/benchmark-ipqc-c-local-path.cjs
