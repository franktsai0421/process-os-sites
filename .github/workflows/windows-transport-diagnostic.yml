name: Windows transport diagnostic (synthetic only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/windows-transport-2x2.mjs'
      - 'tests/windows-transport-2x2.test.mjs'
      - '.github/workflows/windows-transport-diagnostic.yml'
permissions:
  contents: read
jobs:
  synthetic-transport:
    if: ${{ github.event.pull_request.number == 39 }}
    runs-on: windows-latest
    timeout-minutes: 6
    defaults:
      run:
        shell: pwsh
    env:
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_WRITE_LOGS: 'false'
      npm_config_update_notifier: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Normal locked install and unchanged source guard
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/sites-ci-preflight.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pure diagnostic regression (no service)
        run: node --test tests/windows-transport-2x2.test.mjs
      - name: One bounded Windows synthetic 2x2 (eight requests, no retry)
        run: node scripts/windows-transport-2x2.mjs --run-windows-2x2
