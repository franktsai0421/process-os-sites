name: Local safety
on:
  pull_request:
    branches: [main, 'feature/equipment-atomic-save-20261105', 'integration/draft-save-20261104', 'review/quality-20261029-*', 'fix/fqc-authority-body-recovery-20261103', 'feat/discard-unsent-draft-navigation']
permissions:
  contents: read
concurrency:
  group: local-safety-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  local-safety:
    name: Local safety
    runs-on: windows-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    env:
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_WRITE_LOGS: 'false'
      npm_config_update_notifier: 'false'
      PROCESS_PROGRAM_COMMIT: ${{ github.sha }}
    steps:
      - name: Select native Windows ZIP engine
        run: |
          $systemTools = Join-Path $env:SystemRoot 'System32'
          $archiveTool = Join-Path $systemTools 'tar.exe'
          if (-not (Test-Path -LiteralPath $archiveTool)) { throw 'Native Windows archive tool missing' }
          $archiveVersion = & $archiveTool --version
          if ($LASTEXITCODE -ne 0 -or $archiveVersion -notmatch 'bsdtar') { throw 'Unsupported Windows archive engine' }
          $systemTools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        id: install_locked_dependencies
        run: npm ci --no-audit --no-fund
      - name: Normal typed lint
        id: normal_typed_lint
        run: |
          Write-Host 'HEAD_LINT_BEGIN'
          & npm run lint -- --format unix
          $headLintExit = $LASTEXITCODE
          Write-Host "HEAD_LINT_END exit=$headLintExit"
          exit $headLintExit
      - name: Equipment no-poll source and local Save regression
        if: ${{ !cancelled() && steps.install_locked_dependencies.outcome == 'success' }}
        run: |
          node --test --test-concurrency=1 --test-timeout=15000 tests/equipment-no-poll.test.mjs tests/equipment-sent-batch.test.mjs tests/equipment-sent-batch-quarantine.test.mjs tests/equipment-sent-batch-insert-ack.test.mjs tests/access-event-main-integration.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Isolated benchmark tools and preview redirect boundaries
        if: ${{ !cancelled() && steps.install_locked_dependencies.outcome == 'success' }}
        run: |
          # windows-latest provides Python; require the documented minimum.
          python -c "import sys; assert sys.version_info >= (3, 10)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Explicit UTF-8 also applies to Python child fixture processes.
          $env:PYTHONUTF8 = '1'
          python -m unittest discover -s scripts/benchmark -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node node_modules/playwright/cli.js install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/benchmark-preview-smoke.test.mjs tests/benchmark-preview-browser.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Isolated role template layout and payload contract
        env:
          USER_PERMISSIONS_EVIDENCE: ${{ github.workspace }}/.sites-runtime/role-template-layout
          USER_ACCESS_FIXTURE_PORT: '3059'
        run: node tests/role-template-layout-browser.mjs
      - name: Approval tab deep-link native regression
        if: ${{ !cancelled() && steps.install_locked_dependencies.outcome == 'success' }}
        run: |
          node --test tests/approval-deeplink-browser.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: AB C integrated local Save and scoped recovery contracts
        if: ${{ !cancelled() && steps.install_locked_dependencies.outcome == 'success' }}
        run: |
          node --test tests/abc-save-conflict-choice.test.mjs tests/abc-local-save.test.mjs tests/abc-local-bridge.test.mjs tests/master-bridge-ownership.test.mjs tests/master-shared-clone.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: BOM atomic Save and original-operation browser recovery
        if: ${{ !cancelled() && steps.install_locked_dependencies.outcome == 'success' }}
        run: |
          node --test tests/bom-atomic-save.test.cjs tests/bom-atomic-departure.test.mjs tests/bom-bounded-recovery-transport.test.mjs tests/bom-bounded-rejection-route.test.mjs tests/bom-local-recovery-actual-stack.test.mjs tests/bom-manual-ram-save.test.mjs tests/bom-post-authority-actual-stack.test.mjs tests/bom-post-authority-route.test.mjs tests/bom-post-authority-transport.test.mjs tests/bom-review-access-projection.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Routine FQC explicit entry and Update generation
        if: ${{ !cancelled() && steps.install_locked_dependencies.outcome == 'success' }}
        run: |
          node --test tests/routine-fqc-source-contract.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/routine-fqc-explicit-refresh.test.mjs tests/routine-fqc-manual-generation.test.mjs tests/routine-fqc-durable-route.test.mjs tests/routine-fqc-durable-receipt.test.mjs tests/routine-fqc-receipt-only.test.mjs tests/routine-fqc-departure-attribution.test.mjs tests/multiuser-module-departure-routine-save.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: FQC local editing and atomic single Save
        if: ${{ !cancelled() && steps.install_locked_dependencies.outcome == 'success' }}
        run: |
          node --test tests/fqc-single-save.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test --test-concurrency=1 tests/fqc-single-save-browser.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: IPQC A/B local Apply, atomic Save and original receipt recovery
        if: ${{ !cancelled() && steps.install_locked_dependencies.outcome == 'success' }}
        run: |
          node --test tests/ipqc-ab-local-save.test.mjs tests/ab-create-auto-receipt.test.mjs tests/ab-create-rejection-transport.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test --test-concurrency=1 tests/ipqc-ab-scope-permission-races.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Real browser / actual handlers; immediate-Apply VM suites are migrated in place.
          node --test --test-concurrency=1 tests/ab-sent-batch.test.mjs tests/ab-create-next-batch.test.mjs tests/ab-create-rejection-caller.test.mjs tests/ab-create-unknown-map.test.mjs tests/ipqc-ab-local-browser.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: FQC Apply reliability and actual native forms
        if: ${{ !cancelled() && steps.install_locked_dependencies.outcome == 'success' }}
        run: |
          node --test tests/fqc-read-ahead.test.mjs tests/fqc-authority-bodies.test.mjs tests/fqc-write-failure.test.mjs tests/fqc-generation-recovery.test.mjs tests/fqc-recovery-diagnostics.test.mjs tests/fqc-known-rejection.test.mjs tests/fqc-unknown-recovery.test.mjs tests/fqc-apply-reliability.test.mjs tests/fqc-apply-ack.test.mjs tests/fqc-required-dependencies.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Independent Chromium fixtures run sequentially; their in-test actor races and timeouts remain unchanged.
          node --test --test-concurrency=1 tests/fqc-apply-browser.test.mjs tests/fqc-unknown-recovery-browser.test.mjs tests/fqc-abandon-browser.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --max-old-space-size=256 --test tests/fqc-matrix-conflict-discard.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --max-old-space-size=256 --test tests/fqc-matrix-apply-lifecycle.test.mjs tests/fqc-matrix-last-apply.test.mjs tests/fqc-matrix-rejection.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/fqc-matrix-conflict-discard-browser.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: IQC unknown-result reliability and visible recovery
        if: ${{ !cancelled() && steps.install_locked_dependencies.outcome == 'success' }}
        run: |
          node --test tests/iqc-write-reliability.test.mjs tests/iqc-write-handler.test.cjs tests/iqc-local-atomic-save.test.cjs tests/iqc-ordinary-verified-readback.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/iqc-unknown-browser.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-iqc-local-atomic-browser.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exact source baseline for paired performance contracts
        if: ${{ !cancelled() && steps.install_locked_dependencies.outcome == 'success' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ca6647977a8680038444ce2c1ba4e80f2343cd0a
          path: .sites-runtime/performance-baseline
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /lib/master-workflow.ts
            /lib/process-authoring-workflow.ts
            /lib/process-ipqc.ts
            /app/api/master/references/route.ts
            /app/api/process-ipqc/route.ts
            /public/process/process-ipqc.js
      - name: Performance and departure integration contracts
        if: ${{ !cancelled() && steps.install_locked_dependencies.outcome == 'success' }}
        env:
          IPQC_CHOICES_BASELINE_DIR: .sites-runtime/performance-baseline
          MASTER_EQUALITY_BASELINE: .sites-runtime/performance-baseline/lib/master-workflow.ts
          MASTER_BASELINE: .sites-runtime/performance-baseline/lib/master-workflow.ts
          REFERENCES_BASELINE: .sites-runtime/performance-baseline/app/api/master/references/route.ts
          AUTHORING_CONTEXT_BASELINE: .sites-runtime/performance-baseline/lib/process-authoring-workflow.ts
          AUTHORING_IPQC_BASELINE: .sites-runtime/performance-baseline/lib/process-ipqc.ts
        run: |
          # Read exact Git blobs, not Windows CRLF-converted worktree bytes.
          node scripts/materialize-performance-baseline.mjs .sites-runtime/performance-baseline .sites-runtime/performance-baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/performance-baseline.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/shared-unknown-departure.test.mjs tests/navigation-departure.test.mjs tests/delivery-departure.test.mjs tests/owned-draft-ledger.test.mjs tests/owned-draft-revert.test.mjs tests/owned-draft-recovery-transport.test.mjs tests/canvas-departure.test.mjs tests/process-editor-departure.test.mjs tests/editor-selection-departure.test.mjs tests/authoring-departure.test.mjs tests/multiuser-module-departure-helper.test.mjs tests/multiuser-module-departure-bindings.test.mjs tests/authoring-begin-readiness.test.mjs tests/authoring-readiness-render.test.mjs tests/authoring-review-status.test.mjs tests/master-shared-clone.test.mjs tests/master-review-render-performance.test.mjs tests/process-scripts-build.test.mjs tests/process-styles-build.test.mjs tests/spreadsheet-loader.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-authoring-context-reuse.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-master-baseline-equality.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-master-prepared-model.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-master-references-prepared.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-process-ipqc-choice-dom.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-process-ipqc-choice-read.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Source-only history and upload safety
        id: head_validation_01
        if: ${{ !cancelled() && steps.install_locked_dependencies.outcome == 'success' && (steps.normal_typed_lint.outcome == 'success' || steps.normal_typed_lint.outcome == 'failure') }}
        run: node scripts/sites-ci-preflight.mjs
      - name: Full TypeScript
        id: head_validation_02
        if: ${{ !cancelled() && steps.head_validation_01.outcome == 'success' }}
        run: node node_modules/typescript/bin/tsc --noEmit --incremental false
      - name: Shared draft manual synchronization and submission contracts
        if: ${{ !cancelled() && steps.head_validation_02.outcome == 'success' }}
        run: |
          # Both suites import master-ab-auth-phase-fixture.mjs; the fixture is not a zero-case suite.
          node --test --test-concurrency=1 tests/master-ab-auth-phase.test.mjs tests/master-ab-replay-permission.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/shared-draft-pagehide-generation.test.mjs tests/shared-draft-submit-contract.test.mjs tests/shared-draft-no-change.test.mjs tests/canvas-manual-sync.test.mjs tests/canvas-batch-http.test.mjs tests/master-manual-name-apply.test.cjs tests/fqc-matrix-batch.test.mjs tests/quality-submit-confirmation-pins.test.cjs tests/quality-submission-fences.test.mjs tests/lines-submit-snapshot-integration.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build exact checked-out commit
        id: head_validation_03
        if: ${{ !cancelled() && steps.head_validation_02.outcome == 'success' }}
        run: node scripts/local-build.mjs
      - name: AB C compiled integrated local Save and cold-start contracts
        if: ${{ !cancelled() && steps.head_validation_03.outcome == 'success' }}
        run: |
          node tests/abc-local-save-browser.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test --test-concurrency=1 tests/native-ab-startup.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Batch3 full compiled IPQC A B acceptance
        if: ${{ !cancelled() && steps.head_validation_03.outcome == 'success' }}
        run: |
          node --test --test-concurrency=1 tests/ipqc-ab-compiled-browser.acceptance.mjs tests/ipqc-ab-compiled-gaps.acceptance.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: BOM compiled browser atomic Save and silent departure
        if: ${{ !cancelled() && steps.head_validation_03.outcome == 'success' }}
        run: |
          node --test --test-concurrency=1 tests/bom-atomic-browser.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Equipment local atomic Save and native browser
        if: ${{ !cancelled() && steps.head_validation_03.outcome == 'success' }}
        run: |
          node --test tests/equipment-atomic-save.test.mjs tests/equipment-transport-scope.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:EQUIPMENT_BUILT_ASSETS = 'dist/client/process'
          node --test --test-concurrency=1 tests/equipment-atomic-browser.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test --test-concurrency=1 tests/equipment-atomic-compiled.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/equipment-fqc-transfer-save.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test --test-concurrency=1 tests/equipment-transfer-compiled.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Explicit input abandonment in compiled draft pages
        if: ${{ !cancelled() && steps.install_locked_dependencies.outcome == 'success' }}
        run: |
          # Separate compiled Chromium/Miniflare fixtures; preserve in-test races and action deadlines.
          node --test --test-concurrency=1 tests/native-ab-startup.test.mjs tests/draft-abandon-native.test.mjs tests/shared-unknown-departure-native.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Synthetic source, snapshot and authorization regressions
        id: head_validation_04
        if: ${{ !cancelled() && steps.head_validation_03.outcome == 'success' }}
        run: |
          New-Item -ItemType Directory -Force -Path .sites-runtime | Out-Null
          node tests/photo-upload.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-vm-modules tests/photo-routes.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-vm-modules tests/photo-editor.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/snapshot-photo-copy.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-web-feedback.cjs .sites-runtime/ci-photo-feedback
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/sites-root-entry.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/hosted-read-deadline.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/dual-system-route.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-vm-modules tests/sites-import-pending.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-vm-modules tests/sites-owner-bootstrap.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-vm-modules tests/sites-owner-bootstrap-route.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/sites-main-guard.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-collaboration-guard.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-vm-modules tests/sites-ci-preflight.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/sites-ci-negative-review.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-vm-modules tests/sites-source-boundary.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-vm-modules tests/sites-fresh-source.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-vm-modules tests/snapshot-hosted-transfer.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-vm-modules tests/snapshot-recipe-uploader.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/snapshot-owner-verifier.test.mjs tests/snapshot-owner-budget.test.mjs tests/snapshot-owner-applier.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/snapshot-copy-incident.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/snapshot-copy-cost.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-vm-modules tests/snapshot-attempt-budget.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-vm-modules tests/snapshot-retirement.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/snapshot-import-messages.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-vm-modules tests/snapshot-browser-handoff.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node tests/snapshot-operational.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node tests/snapshot-operational-files.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node tests/snapshot-batch.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node tests/snapshot-progress.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node tests/snapshot-batched-uploader.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node tests/login-destination.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-vm-modules tests/snapshot-hosted-activation.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-vm-modules tests/snapshot-normalize.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-vm-modules tests/snapshot-normalize-files.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
