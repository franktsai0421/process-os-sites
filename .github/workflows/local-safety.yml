          $actualBase = & git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actualBase -ne $base) { throw 'Unexpected baseline commit' }
          & node (Join-Path $env:GITHUB_WORKSPACE 'tests/lint-baseline-inputs.test.mjs')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
