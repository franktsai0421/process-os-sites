          node scripts/test-canvas-pan-cancel.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-canvas-fit-origin.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/input-resource-lifecycle.test.mjs tests/iqc-viewer-invalidation.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/shared-draft-terminal-admission.test.mjs tests/shared-draft-receipt-recovery.test.mjs tests/iqc-editor-terminal.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-equipment-full-read.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-media-cache-fast-path.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-media-fast-path-routes.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/login-intent.test.mjs tests/delivery-read-plan.test.mjs tests/process-bootstrap.test.mjs tests/integrated-bootstrap-client.test.mjs tests/player-intent.test.mjs tests/destination-delivery.test.mjs tests/delivery-navigation.test.mjs tests/navigation-lifecycle.test.mjs tests/navigation-adapters.test.mjs tests/destination-transaction.test.mjs tests/bounded-media-loading.test.mjs tests/shared-draft-no-change.test.mjs tests/ci-integrated-exit.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-shared-draft-client-v3.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-iqc-bounded-read.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-integrated-workflow-cycles.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-bom-workflow.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-routine-fqc-operations.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-effective-delivery-formats.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-asset-delivery-read.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/fqc-readiness.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-fqc-catalog-read.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-equipment-catalog-read.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-integrated-bootstrap.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-scheduled-backup-read.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/test-automatic-backups-disabled.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-v3-save-unknown-snapshot.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-user-access.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-routine-fqc-bom-boundary.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-routine-api-fixture.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-quality-equipment-replacement.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: IPQC-C bounded reads and compatibility
        run: |
          node scripts/test-ipqc-c-bounded-read.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-ipqc-c-permissions-read.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-ipqc-ab-bounded-read.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-access-template-reuse.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bootstrap bounded reads without production instrumentation
        run: node scripts/test-bootstrap-read-reduction.cjs
      - name: Opt-in feedback cloud entry, ownership and reserved toolbar geometry
        run: |
          node --test tests/web-feedback-cloud.test.mjs tests/web-feedback-layout.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-feedback-cloud-admission.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-feedback-open-authorization.cjs --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-ui-review-refresh.mjs --feedback-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compiled module-scoped bootstrap and canonical image boundaries
        run: node tests/sites-integrated-bootstrap-native.test.mjs
      - name: Compiled destination pages in an isolated browser with synthetic identities
        run: node tests/sites-delivery-browser.test.mjs
      - name: Dormant native staging authority and synthetic transport
        run: |
          node --test tests/snapshot-native-capability.test.mjs tests/snapshot-native-intents.test.mjs tests/snapshot-native-handler.test.mjs tests/snapshot-native-input.test.mjs tests/snapshot-native-source.test.mjs tests/snapshot-native-transport.test.mjs tests/snapshot-native-performance.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compiled application owner setup with synthetic nonpersistent bindings
        run: node tests/sites-owner-bootstrap-native.test.mjs
      - name: Compiled root entry with synthetic nonpersistent bindings
        run: node tests/sites-root-entry-native.test.mjs
      - name: Compiled pending-import client with synthetic nonpersistent bindings
        run: node --experimental-vm-modules tests/sites-import-pending-native.test.mjs
      - name: Compiled authenticated recipe upload with synthetic nonpersistent bindings
        run: node --experimental-vm-modules tests/sites-import-uploader-native.test.mjs
      - name: Compiled continuous owner verification without local files or native credentials
        run: node tests/sites-owner-continuation-native.test.mjs
      - name: Compiled owner application with retained credentials and isolated data
        run: node tests/sites-owner-application-native.test.mjs
      - name: Compiled fixed copy incident with synthetic data and nonpersistent D1/R2
        run: node tests/sites-copy-incident-native.test.mjs
      - name: Fixed three-file startup supplement with synthetic storage only
        run: |
          node --test tests/startup-assets.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/sites-startup-assets-native.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compiled bounded attempt with synthetic nonpersistent bindings
        # Bounded mode is a finite approved attempt, not measured provider quota.
        # The following compiled test uses fake credentials and ephemeral storage.
        run: |
          node --experimental-vm-modules tests/sites-bounded-import-native.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'Bounded attempt evidence is synthetic only; no live upload or spending authority.'
      - name: Compiled owner-approved cancelled campaign quarantine
        run: node --experimental-vm-modules tests/sites-retirement-native.test.mjs
      - name: Exact incident maintenance and same-process verification host with synthetic inputs
        run: node --test tests/sites-fresh-recovery-schema.test.mjs tests/snapshot-incident-recovery.test.mjs tests/snapshot-incident-host.test.mjs tests/snapshot-control-cost.test.mjs
      - name: Compiled exact incident recovery and restricted native scope with synthetic bindings
        run: node tests/sites-incident-recovery-native.test.mjs
      - name: Version19 exact incident adapter and guarded D1 regressions
        run: |
          node --test tests/snapshot-v19-recovery.test.mjs tests/snapshot-v19-runtime.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/sites-v19-recovery-native.test.mjs
      - name: Fixed one-shot owner observation with synthetic inputs only
        run: |
          node tests/c273-observation.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/c273-observation-client.test.mjs
      - name: Compiled fixed one-shot owner observation with ephemeral storage
        run: node tests/sites-c273-observation-native.test.mjs
      - name: Compiled dormant native staging capability with fake storage only
        run: node tests/sites-native-capability-runtime.test.mjs
      - name: Compiled authenticated photo uploads with synthetic nonpersistent bindings
        run: node tests/photo-upload-native.test.mjs
      - name: Record final evidence boundary
        run: |
          Write-Output 'Source-only synthetic CI; no private canonical package, real R1 import, platform credential, deployment or production DB/R2.'
          Write-Output 'Phase18 external compiled HTTP and official Sites packager receipts are reused evidence, not CI executions.'
