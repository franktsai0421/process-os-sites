      - name: Native isolated outbound-denial regression
        run: node tests/local-worker-outbound.test.mjs
      - name: Integrated entry and read-only delivery contracts
        run: |
          node scripts/test-authoring-bom-map-removal.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-authoring-begin-recovery.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-authoring-unknown-recovery.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-canvas-unknown-recovery.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-login-reentry.cjs
