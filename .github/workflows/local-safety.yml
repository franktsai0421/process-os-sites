      - name: Native isolated outbound-denial regression
        id: head_validation_05
        if: ${{ !cancelled() && steps.head_validation_04.outcome == 'success' }}
        run: node tests/local-worker-outbound.test.mjs
      - name: Integrated entry and read-only delivery contracts
        id: head_validation_06
        if: ${{ !cancelled() && steps.head_validation_05.outcome == 'success' }}
        run: |
          node --test tests/tooling-local-atomic-save.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
