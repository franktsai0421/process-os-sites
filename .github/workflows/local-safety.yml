      - name: Checkout exact baseline for failed-lint diagnosis
        if: ${{ failure() && steps.normal_typed_lint.outcome == 'failure' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: db190a37ff7b9c5dc1e098e2a62d9d9ddff504da
          path: .sites-runtime/lint-baseline
          fetch-depth: 0
          persist-credentials: false
      - name: Diagnose exact baseline without relaxing head lint
        if: ${{ failure() && steps.normal_typed_lint.outcome == 'failure' }}
        working-directory: .sites-runtime/lint-baseline
        run: |
          $base = 'db190a37ff7b9c5dc1e098e2a62d9d9ddff504da'
          $actualBase = & git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actualBase -ne $base) { throw 'Unexpected baseline commit' }
          foreach ($file in @('package.json', 'package-lock.json', '.oxlintrc.json', 'tsconfig.json', '.githooks/pre-push', 'scripts/main-push-guard.mjs', 'scripts/collaboration-setup.mjs')) {
            $headBlob = & git -C $env:GITHUB_WORKSPACE rev-parse "HEAD:$file"
            if ($LASTEXITCODE -ne 0) { throw 'Head lint input missing' }
            $baseBlob = & git rev-parse "HEAD:$file"
            if ($LASTEXITCODE -ne 0 -or $headBlob -ne $baseBlob) { throw 'Baseline lint or guard inputs differ' }
          }
          # Normal postinstall must install/verify unchanged guards in a standalone checkout.
          & npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "BASE_LINT_BEGIN commit=$base"
          & npm run lint -- --format unix
          $baseLintExit = $LASTEXITCODE
          Write-Host "BASE_LINT_END exit=$baseLintExit"
          # This diagnostic never changes the already failed head-lint outcome.
          exit $baseLintExit
      - name: Record final evidence boundary
        run: |
          Write-Output 'Source-only synthetic CI; no private canonical package, real R1 import, platform credential, deployment or production DB/R2.'
          Write-Output 'Phase18 external compiled HTTP and official Sites packager receipts are reused evidence, not CI executions.'
