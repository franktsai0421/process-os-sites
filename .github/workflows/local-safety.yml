          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-process-save-record-mutation.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-process-flow-record-mutation.cjs
