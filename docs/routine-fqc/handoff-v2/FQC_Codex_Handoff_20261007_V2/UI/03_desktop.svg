<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980"><style>text{font-family:Microsoft JhengHei,PingFang TC,Noto Sans CJK TC,sans-serif}</style><rect x="0" y="0" width="1440" height="980" rx="0" fill="#edf2f5" stroke="#d8e2e8"/><rect x="0" y="0" width="215" height="980" rx="0" fill="#173344" stroke="#d8e2e8"/><text x="28" y="53" font-size="28" fill="white" font-weight="700">品質管理</text><text x="28" y="82" font-size="14" fill="#b6cedb" font-weight="400">QUALITY OS</text><text x="30" y="132" font-size="18" fill="white" font-weight="400">總覽</text><text x="30" y="172" font-size="18" fill="white" font-weight="400">標準搜尋</text><text x="30" y="212" font-size="18" fill="white" font-weight="400">品質報告</text><rect x="16" y="220" width="183" height="46" rx="8" fill="#2f6177" stroke="#2f6177"/><text x="30" y="252" font-size="18" fill="white" font-weight="400">例行檢查</text><text x="30" y="292" font-size="18" fill="white" font-weight="400">FPY</text><text x="30" y="332" font-size="18" fill="white" font-weight="400">版本確認平台</text><text x="30" y="372" font-size="18" fill="white" font-weight="400">資料後台</text><text x="240" y="37" font-size="16" fill="#a24c23" font-weight="400">3040 隔離測試 · 新製作 UI 參考 · 非正式畫面／非驗收證據</text><text x="240" y="83" font-size="30" fill="#173344" font-weight="700">03  填寫檢查報告</text><rect x="240" y="108" width="255" height="45" rx="12" fill="#24617a" stroke="#d8e2e8"/><text x="255" y="137" font-size="17" fill="white" font-weight="400">FQC</text><rect x="510" y="108" width="255" height="45" rx="12" fill="#ffffff" stroke="#d8e2e8"/><text x="525" y="137" font-size="17" fill="#355263" font-weight="400">IQC</text><rect x="780" y="108" width="255" height="45" rx="12" fill="#ffffff" stroke="#d8e2e8"/><text x="795" y="137" font-size="17" fill="#355263" font-weight="400">模具檢查</text><rect x="1050" y="108" width="255" height="45" rx="12" fill="#ffffff" stroke="#d8e2e8"/><text x="1065" y="137" font-size="17" fill="#355263" font-weight="400">檢具與測試設備校準</text><rect x="240" y="171" width="1170" height="71" rx="12" fill="#fff8e8" stroke="#d4bc83"/><text x="259" y="199" font-size="18" fill="#785b20" font-weight="700">既有共用文稿元件保留區 — 這裡不是重新設計</text><text x="259" y="224" font-size="16" fill="#785b20" font-weight="400">文稿／操作／報錯／待補／操作紀錄：位置、順序及樣式以目前本機元件為準</text><rect x="240" y="263" width="1170" height="50" rx="12" fill="#ffffff" stroke="#d8e2e8"/><text x="259" y="295" font-size="17" fill="#203746" font-weight="400">線別：全部　｜　類別：全部　｜　檢查項目：搜尋名稱或編號</text><rect x="240" y="333" width="355" height="473" rx="12" fill="#ffffff" stroke="#d8e2e8"/><rect x="613" y="333" width="797" height="473" rx="12" fill="#ffffff" stroke="#d8e2e8"/><text x="262" y="375" font-size="18" fill="#203746" font-weight="400">本份報告 / RP-DEMO-001</text><text x="262" y="423" font-size="18" fill="#203746" font-weight="400">01 耐壓測試　不合格</text><text x="262" y="471" font-size="18" fill="#203746" font-weight="400">02 脈衝測試　合格</text><text x="262" y="519" font-size="18" fill="#203746" font-weight="400">03 耐久測試　無法測試</text><text x="262" y="567" font-size="18" fill="#203746" font-weight="400">────────────</text><text x="262" y="615" font-size="18" fill="#203746" font-weight="400">同一份報告逐項填結果</text><text x="262" y="663" font-size="18" fill="#203746" font-weight="400">尚未儲存 · 僅示意</text><text x="262" y="711" font-size="18" fill="#203746" font-weight="400">缺照片可存草稿，不可送審</text><text x="636" y="377" font-size="22" fill="#173344" font-weight="700">耐壓測試 / 標準版本 V-DEMO</text><text x="636" y="431" font-size="18" fill="#203746" font-weight="400">涵蓋產品：甲、乙、丙（來源快照）</text><text x="636" y="480" font-size="18" fill="#203746" font-weight="400">實測樣品：[ 搜尋代碼或名稱 ]　☑甲 □乙 □丙</text><text x="636" y="529" font-size="18" fill="#203746" font-weight="400">結果：○合格　●不合格　○無法測試　○無法判定</text><text x="636" y="578" font-size="18" fill="#203746" font-weight="400">問題說明：測試過程發現接頭漏水（示例）</text><text x="636" y="627" font-size="18" fill="#203746" font-weight="400">照片：至少一張成功上傳；示例卡僅供3040</text><rect x="637" y="693" width="745" height="68" rx="12" fill="#fff0ed" stroke="#e3b1a8"/><text x="655" y="721" font-size="18" fill="#a43a31" font-weight="400">報錯：未成功上傳照片時，整份報告不能送審</text><text x="655" y="747" font-size="16" fill="#a43a31" font-weight="400">可以先儲存草稿；本次必填規則不改其他主資料模組</text><rect x="636" y="831" width="235" height="48" rx="12" fill="#ffffff" stroke="#d8e2e8"/><text x="653" y="862" font-size="18" fill="#244a5d" font-weight="400">上傳照片</text><rect x="886" y="831" width="235" height="48" rx="12" fill="#ffffff" stroke="#d8e2e8"/><text x="903" y="862" font-size="18" fill="#244a5d" font-weight="400">儲存草稿</text><rect x="1136" y="831" width="235" height="48" rx="12" fill="#24617a" stroke="#d8e2e8"/><text x="1153" y="862" font-size="18" fill="white" font-weight="400">送出審核</text><text x="240" y="924" font-size="16" fill="#617783" font-weight="400">資料、編號、日期均為示例。正式頁面需支援中越雙語；沿用現有品質系統色系。</text></svg>