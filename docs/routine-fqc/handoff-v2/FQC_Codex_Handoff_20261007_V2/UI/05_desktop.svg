<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980"><style>text{font-family:Microsoft JhengHei,PingFang TC,Noto Sans CJK TC,sans-serif}</style><rect x="0" y="0" width="1440" height="980" rx="0" fill="#edf2f5" stroke="#d8e2e8"/><rect x="0" y="0" width="215" height="980" rx="0" fill="#173344" stroke="#d8e2e8"/><text x="28" y="53" font-size="28" fill="white" font-weight="700">品質管理</text><text x="28" y="82" font-size="14" fill="#b6cedb" font-weight="400">QUALITY OS</text><text x="30" y="132" font-size="18" fill="white" font-weight="400">總覽</text><text x="30" y="172" font-size="18" fill="white" font-weight="400">標準搜尋</text><text x="30" y="212" font-size="18" fill="white" font-weight="400">品質報告</text><rect x="16" y="220" width="183" height="46" rx="8" fill="#2f6177" stroke="#2f6177"/><text x="30" y="252" font-size="18" fill="white" font-weight="400">例行檢查</text><text x="30" y="292" font-size="18" fill="white" font-weight="400">FPY</text><text x="30" y="332" font-size="18" fill="white" font-weight="400">版本確認平台</text><text x="30" y="372" font-size="18" fill="white" font-weight="400">資料後台</text><text x="240" y="37" font-size="16" fill="#a24c23" font-weight="400">3040 隔離測試 · 新製作 UI 參考 · 非正式畫面／非驗收證據</text><text x="240" y="83" font-size="30" fill="#173344" font-weight="700">05  異常改善與結案</text><rect x="240" y="108" width="255" height="45" rx="12" fill="#24617a" stroke="#d8e2e8"/><text x="255" y="137" font-size="17" fill="white" font-weight="400">FQC</text><rect x="510" y="108" width="255" height="45" rx="12" fill="#ffffff" stroke="#d8e2e8"/><text x="525" y="137" font-size="17" fill="#355263" font-weight="400">IQC</text><rect x="780" y="108" width="255" height="45" rx="12" fill="#ffffff" stroke="#d8e2e8"/><text x="795" y="137" font-size="17" fill="#355263" font-weight="400">模具檢查</text><rect x="1050" y="108" width="255" height="45" rx="12" fill="#ffffff" stroke="#d8e2e8"/><text x="1065" y="137" font-size="17" fill="#355263" font-weight="400">檢具與測試設備校準</text><rect x="240" y="171" width="1170" height="71" rx="12" fill="#fff8e8" stroke="#d4bc83"/><text x="259" y="199" font-size="18" fill="#785b20" font-weight="700">既有共用文稿元件保留區 — 這裡不是重新設計</text><text x="259" y="224" font-size="16" fill="#785b20" font-weight="400">文稿／操作／報錯／待補／操作紀錄：位置、順序及樣式以目前本機元件為準</text><rect x="240" y="263" width="1170" height="50" rx="12" fill="#ffffff" stroke="#d8e2e8"/><text x="259" y="295" font-size="17" fill="#203746" font-weight="400">線別：全部　｜　類別：全部　｜　檢查項目：搜尋名稱或編號</text><rect x="240" y="333" width="355" height="473" rx="12" fill="#ffffff" stroke="#d8e2e8"/><rect x="613" y="333" width="797" height="473" rx="12" fill="#ffffff" stroke="#d8e2e8"/><text x="262" y="375" font-size="18" fill="#203746" font-weight="400">異常案件</text><text x="262" y="423" font-size="18" fill="#203746" font-weight="400">NC-DEMO-001　待改善</text><text x="262" y="471" font-size="18" fill="#203746" font-weight="400">耐壓測試 · 實測甲</text><text x="262" y="519" font-size="18" fill="#203746" font-weight="400">原期別：十月份</text><text x="262" y="567" font-size="18" fill="#203746" font-weight="400">────────────</text><text x="262" y="615" font-size="18" fill="#203746" font-weight="400">NC-DEMO-002　已結案</text><text x="262" y="663" font-size="18" fill="#203746" font-weight="400">脈衝測試 · 處置結案</text><text x="262" y="711" font-size="18" fill="#203746" font-weight="400">已結案仍可搜尋</text><text x="636" y="377" font-size="22" fill="#173344" font-weight="700">NC-DEMO-001 / 完整歷史</text><text x="636" y="431" font-size="18" fill="#203746" font-weight="400">RP-001 首測不合格 → 改善紀錄01</text><text x="636" y="480" font-size="18" fill="#203746" font-weight="400">RP-002 複測仍不合格 → 改善紀錄02</text><text x="636" y="529" font-size="18" fill="#203746" font-weight="400">RP-003 複測合格且核准 → 可確認結案</text><text x="636" y="578" font-size="18" fill="#203746" font-weight="400">每份報告與照片保留，不覆蓋前次結果</text><text x="636" y="627" font-size="18" fill="#203746" font-weight="400">或申請處置結案：原因＋處置＋證據</text><text x="636" y="676" font-size="18" fill="#203746" font-weight="400">下一期照常產生，不自動關掉這個舊案</text><rect x="637" y="697" width="745" height="62" rx="12" fill="#eaf3f6" stroke="#c5dce4"/><text x="655" y="723" font-size="17" fill="#203746" font-weight="400">下一步清楚可見；操作後仍保留原報告與完整歷史</text><text x="655" y="746" font-size="15" fill="#203746" font-weight="400">正式系統需依權限、狀態與CAS檢查執行；本圖按鈕僅為示意</text><rect x="636" y="831" width="235" height="48" rx="12" fill="#ffffff" stroke="#d8e2e8"/><text x="653" y="862" font-size="18" fill="#244a5d" font-weight="400">新增改善</text><rect x="886" y="831" width="235" height="48" rx="12" fill="#ffffff" stroke="#d8e2e8"/><text x="903" y="862" font-size="18" fill="#244a5d" font-weight="400">建立複測</text><rect x="1136" y="831" width="235" height="48" rx="12" fill="#24617a" stroke="#d8e2e8"/><text x="1153" y="862" font-size="18" fill="white" font-weight="400">申請處置結案</text><text x="240" y="924" font-size="16" fill="#617783" font-weight="400">資料、編號、日期均為示例。正式頁面需支援中越雙語；沿用現有品質系統色系。</text></svg>